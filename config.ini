; =====================================================================
;  ISG-NIS-Helper configuration
;  ---------------------------------------------------------------
;  EVERY per-machine setting is in this file. The code never needs
;  editing. Comments must be on their own line -- ";" is the list
;  separator inside data_roots.
;
;  Anything containing <<<SET_ME ...>>> must be replaced. Run
;  Run-PreScan.bat and it will fill most of these in for you.
; =====================================================================

[instrument]
; Whatever people call this scope. Appears in every log row.
computer_label   = <<<SET_ME: e.g. SCOPE-1 Ti2 Widefield>>>

; Blank uses the Windows computer name.
computer_id      =

; What users see on the sign-in window and every dialog. Never the
; project name: something that reads as part of the microscope gets
; ignored, a product name invites curiosity.
display_name     = Microscope Access Log


[paths]
; Full path to the NIS-Elements program ISG-NIS-Helper launches.
; Right-click the NIS desktop shortcut > Properties > Target.
nis_executable   = <<<SET_ME: C:\Program Files\NIS-Elements\nis_ar.exe>>>

; Folders to snapshot before and after each session, semicolon-separated.
; ONLY ever read (scandir + stat). Nothing is opened, moved or modified.
data_roots       = <<<SET_ME: D:\; E:\; F:\>>>

; The approved user list. Blank means users.csv next to this file, which
; is what you want: each instrument keeps its own list, in one folder,
; with no network dependency.
users_file       =

; Where sessions, logs and state are written. Granted Modify to the Users
; group at install time. Leave this alone.
local_root       = C:\ProgramData\ISG-NIS-Helper

; OPTIONAL. A folder to mirror finished session logs into, so several
; scopes pool their records in one place. Leave BLANK for local only.
; ISG-NIS-Helper never reads anything from here and never depends on it --
; if it is unreachable, logs queue locally and copy over later.
network_root     =


[processes]
; Process names that count as "NIS-Elements is open". ACQUISITION MODULES
; ONLY. Never add a permanently-running service: ISG-NIS-Helper would believe
; NIS is always open, sessions would never end, and the watcher would try
; to close it on a loop. Preflight blocks the ones we know about.
nis_process_names   = nis_ar.exe, nis_br.exe, nis_c.exe, nis_d.exe, nis_el.exe, nis_elements.exe

; Gate the free Viewer too? Usually false -- reviewing data is not the problem.
gate_viewer         = false
viewer_process_names = nis_viewer.exe, nis-elements viewer.exe


[behavior]
; Seconds a direct (non-ISG-NIS-Helper) launch of NIS may run before it is
; closed, if nobody signs in. Generous: sign in and it never fires.
launch_grace_seconds  = 120
poll_seconds          = 3
heartbeat_seconds     = 15

; How long the NIS-Elements shortcut waits for the sign-in window to take
; over before it gives up and opens NIS itself (fail-open, so the instrument
; is never left unusable by a fault in the launcher).
launcher_wait_seconds = 30

; After "End session / switch user", NIS may stay open this long while
; the next person signs in.
handoff_grace_seconds = 300

; Also append every session row to one rolling index.csv per computer.
write_master_index    = true

; Cap on rows in a session's file-change list. Truncation is flagged.
max_detail_rows       = 50000

; true = the sign-in window is full-screen and harder to ignore.
fullscreen_signin     = false

; Corner for the "session active" badge: tl, tr, bl, br
badge_corner          = br


[scan]
exclude_dirs       = $RECYCLE.BIN; System Volume Information; Windows; Program Files; Program Files (x86); AppData; ProgramData; $WinREAgent; Recovery
include_extensions =
follow_symlinks    = false


[failsafe]
; ISG-NIS-Helper treats its power to CLOSE NIS-Elements as a privilege it has
; to keep earning. Nothing here can stop it recording; these only govern
; whether it may close anything. Losing a deterrent for a day is cheap.
; Losing an overnight acquisition is not.
confirm_polls             = 3
post_update_grace_hours   = 24
max_terminations_per_hour = 3
max_errors_per_10min      = 10
require_agent             = true
agent_silence_seconds     = 120


[contacts]
; Shown on the sign-in window, hyperlinked as mailto: links.
admin1_name  = Andrew Bazley
admin1_email = Andrew.Bazley@nyulangone.org
admin2_name  = Guru Kidiyoor
admin2_email = gururaj.kidiyoor@nyulangone.org


[access]
; For department managers only. Signing in with this prompts for a typed
; name and flags the session master_pin_used = true.
master_pin = <<<SET_ME: e.g. 906118>>>
